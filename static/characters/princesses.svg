<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs><style>
    .char{transform-box:fill-box;transform-origin:center;}
    .companion-widget.state-happy .char{animation:flora-h 1s ease-in-out infinite alternate;}
    .companion-widget.state-sad   .char{animation:flora-s 2.5s ease-in-out infinite;filter:saturate(.45);}
    .companion-widget.state-sick  .char{animation:flora-k 3s ease-in-out infinite;filter:saturate(.1) brightness(.7);}
    .companion-widget.state-critical .char{animation:flora-c .8s ease-in-out infinite;filter:saturate(0) brightness(.45);}
    @keyframes flora-h{from{transform:translateY(0) scale(1);}to{transform:translateY(-5px) scale(1.06);}}
    @keyframes flora-s{0%,100%{transform:rotate(-8deg) translateY(3px);}50%{transform:rotate(8deg) translateY(3px);}}
    @keyframes flora-k{0%,100%{transform:scale(.91) translateY(4px);}50%{transform:scale(.87) translateY(7px);}}
    @keyframes flora-c{0%,100%{opacity:1;transform:scale(.87);}50%{opacity:.28;transform:scale(.82);}}
  </style></defs>
  <g class="char">
    <!-- wings behind -->
    <ellipse cx="24" cy="55" rx="16" ry="22" fill="#E8BBFF" stroke="#CC88FF" stroke-width="1.5" opacity=".75" transform="rotate(20 24 55)"/>
    <ellipse cx="76" cy="55" rx="16" ry="22" fill="#E8BBFF" stroke="#CC88FF" stroke-width="1.5" opacity=".75" transform="rotate(-20 76 55)"/>
    <ellipse cx="22" cy="60" rx="10" ry="14" fill="#D4A0FF" opacity=".55" transform="rotate(20 22 60)"/>
    <ellipse cx="78" cy="60" rx="10" ry="14" fill="#D4A0FF" opacity=".55" transform="rotate(-20 78 60)"/>
    <!-- dress body -->
    <path d="M38,62 Q35,90 30,94 Q50,98 70,94 Q65,90 62,62 Z" fill="#FF88BB" stroke="#DD5588" stroke-width="1.5"/>
    <path d="M40,65 Q50,75 60,65" stroke="#FF66AA" stroke-width="6" fill="none" stroke-linecap="round" opacity=".5"/>
    <!-- bodice -->
    <ellipse cx="50" cy="60" rx="14" ry="8" fill="#FF66AA" stroke="#DD3388" stroke-width="1.2"/>
    <!-- head -->
    <circle cx="50" cy="38" r="20" fill="#FFCBA4" stroke="#E8A87C" stroke-width="1.5"/>
    <!-- hair -->
    <ellipse cx="50" cy="22" rx="20" ry="10" fill="#FFE080"/>
    <path d="M30,28 Q20,40 22,58" stroke="#FFD040" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M70,28 Q80,40 78,58" stroke="#FFD040" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- crown -->
    <path d="M33,25 L35,15 L38,22 L42,12 L46,20 L50,10 L54,20 L58,12 L62,22 L65,15 L67,25 Z" fill="#FFD700" stroke="#F59E00" stroke-width="1.2"/>
    <circle cx="50" cy="12" r="3" fill="#FF3366"/>
    <circle cx="42" cy="14" r="2" fill="#3366FF"/>
    <circle cx="58" cy="14" r="2" fill="#33BB33"/>
    <!-- eyes -->
    <ellipse cx="43" cy="38" rx="4.5" ry="5" fill="white"/>
    <ellipse cx="57" cy="38" rx="4.5" ry="5" fill="white"/>
    <circle cx="43" cy="39" r="3" fill="#5533AA"/>
    <circle cx="57" cy="39" r="3" fill="#5533AA"/>
    <circle cx="44.2" cy="37.5" r="1.2" fill="white"/>
    <circle cx="58.2" cy="37.5" r="1.2" fill="white"/>
    <!-- lashes -->
    <path d="M39,34 Q41,31 43,33" stroke="#333" stroke-width="1.2" fill="none"/>
    <path d="M57,33 Q59,31 61,34" stroke="#333" stroke-width="1.2" fill="none"/>
    <!-- blush -->
    <ellipse cx="36" cy="44" rx="5" ry="3" fill="#FF9999" opacity=".55"/>
    <ellipse cx="64" cy="44" rx="5" ry="3" fill="#FF9999" opacity=".55"/>
    <!-- nose -->
    <ellipse cx="50" cy="44" rx="2" ry="1.5" fill="#E8A87C"/>
    <!-- smile -->
    <path d="M44,48 Q50,54 56,48" stroke="#CC3366" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <!-- wand -->
    <line x1="68" y1="50" x2="84" y2="30" stroke="#9966FF" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="84,22 86,29 83,29" fill="#FFD700" stroke="#FFB800" stroke-width="1"/>
    <circle cx="84" cy="25" r="5" fill="#FFD700" stroke="#FFB800" stroke-width="1.2"/>
    <!-- wand sparkles -->
    <circle cx="76" cy="36" r="2" fill="#FFE070" opacity=".9"/>
    <circle cx="88" cy="38" r="1.5" fill="#FF88CC" opacity=".9"/>
    <circle cx="90" cy="28" r="1.2" fill="#88CCFF" opacity=".9"/>
  </g>
</svg>