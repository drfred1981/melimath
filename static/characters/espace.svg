<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs><style>
    .char{transform-box:fill-box;transform-origin:center;}
    .companion-widget.state-happy .char{animation:cosmo-h 1s ease-in-out infinite alternate;}
    .companion-widget.state-sad   .char{animation:cosmo-s 2.5s ease-in-out infinite;filter:saturate(.45);}
    .companion-widget.state-sick  .char{animation:cosmo-k 3s ease-in-out infinite;filter:saturate(.1) brightness(.7);}
    .companion-widget.state-critical .char{animation:cosmo-c .8s ease-in-out infinite;filter:saturate(0) brightness(.45);}
    @keyframes cosmo-h{from{transform:translateY(0) scale(1);}to{transform:translateY(-5px) scale(1.06);}}
    @keyframes cosmo-s{0%,100%{transform:rotate(-8deg) translateY(3px);}50%{transform:rotate(8deg) translateY(3px);}}
    @keyframes cosmo-k{0%,100%{transform:scale(.91) translateY(4px);}50%{transform:scale(.87) translateY(7px);}}
    @keyframes cosmo-c{0%,100%{opacity:1;transform:scale(.87);}50%{opacity:.28;transform:scale(.82);}}
  </style></defs>
  <g class="char">
    <!-- stars bg -->
    <circle cx="12" cy="18" r="1.5" fill="white" opacity=".8"/>
    <circle cx="88" cy="22" r="1.2" fill="white" opacity=".8"/>
    <circle cx="20" cy="80" r="1.2" fill="white" opacity=".7"/>
    <circle cx="82" cy="75" r="1.5" fill="white" opacity=".7"/>
    <circle cx="8"  cy="50" r="1"   fill="white" opacity=".6"/>
    <circle cx="92" cy="50" r="1"   fill="white" opacity=".6"/>
    <circle cx="50" cy="8"  r="1.2" fill="white" opacity=".7"/>
    <!-- suit body -->
    <rect x="30" y="64" width="40" height="28" rx="12" ry="12" fill="#DDEEFF" stroke="#99BBDD" stroke-width="1.8"/>
    <!-- suit left arm -->
    <ellipse cx="22" cy="70" rx="10" ry="7" fill="#DDEEFF" stroke="#99BBDD" stroke-width="1.5" transform="rotate(-20 22 70)"/>
    <circle cx="15" cy="75" r="5" fill="#AABBCC" stroke="#88AACC" stroke-width="1.2"/>
    <!-- suit right arm -->
    <ellipse cx="78" cy="70" rx="10" ry="7" fill="#DDEEFF" stroke="#99BBDD" stroke-width="1.5" transform="rotate(20 78 70)"/>
    <circle cx="85" cy="75" r="5" fill="#AABBCC" stroke="#88AACC" stroke-width="1.2"/>
    <!-- chest panel -->
    <rect x="38" y="68" width="24" height="16" rx="4" fill="#AACCEE" stroke="#88AACC" stroke-width="1.2"/>
    <circle cx="44" cy="74" r="2.5" fill="#FF4444"/>
    <circle cx="50" cy="74" r="2.5" fill="#44BB44"/>
    <circle cx="56" cy="74" r="2.5" fill="#4488FF"/>
    <rect x="42" y="78" width="16" height="3" rx="1.5" fill="#88AACC"/>
    <!-- neck ring -->
    <rect x="36" y="60" width="28" height="8" rx="4" fill="#BBCCDD" stroke="#99BBDD" stroke-width="1.5"/>
    <!-- helmet -->
    <circle cx="50" cy="40" r="26" fill="#E8F0FF" stroke="#BBCCDD" stroke-width="2"/>
    <!-- helmet shading -->
    <circle cx="50" cy="40" r="26" fill="url(#hgrad)" opacity=".3"/>
    <defs><radialGradient id="hgrad" cx="35%" cy="30%"><stop offset="0%" stop-color="white"/><stop offset="100%" stop-color="#8899BB"/></radialGradient></defs>
    <!-- visor -->
    <ellipse cx="50" cy="42" rx="18" ry="16" fill="#2255AA" opacity=".85" stroke="#1133AA" stroke-width="1.5"/>
    <ellipse cx="50" cy="42" rx="18" ry="16" fill="url(#vgrad)" opacity=".4"/>
    <defs><radialGradient id="vgrad" cx="35%" cy="30%"><stop offset="0%" stop-color="white"/><stop offset="100%" stop-color="#4477FF"/></radialGradient></defs>
    <!-- face inside visor -->
    <circle cx="44" cy="40" r="4" fill="white"/>
    <circle cx="56" cy="40" r="4" fill="white"/>
    <circle cx="44" cy="41" r="2.5" fill="#334488"/>
    <circle cx="56" cy="41" r="2.5" fill="#334488"/>
    <circle cx="44.8" cy="39.5" r="1" fill="white"/>
    <circle cx="56.8" cy="39.5" r="1" fill="white"/>
    <path d="M44,48 Q50,54 56,48" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- helmet details -->
    <path d="M26,38 Q28,30 36,26" stroke="#BBCCDD" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- reflections on helmet -->
    <ellipse cx="34" cy="24" rx="6" ry="3" fill="white" opacity=".35" transform="rotate(-30 34 24)"/>
  </g>
</svg>